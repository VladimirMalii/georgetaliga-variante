<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Ilustrație: cabinet medical luminos, cu fereastră și plante">
  <defs>
    <linearGradient id="cer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f7f9"/>
      <stop offset="55%" stop-color="#dceaef"/>
      <stop offset="100%" stop-color="#e4ede7"/>
    </linearGradient>
    <linearGradient id="lumina" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="perete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f2ec"/>
      <stop offset="100%" stop-color="#ebe2d8"/>
    </linearGradient>
    <linearGradient id="birou" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a888"/>
      <stop offset="100%" stop-color="#b08e6e"/>
    </linearGradient>
  </defs>

  <!-- perete -->
  <rect width="800" height="1000" fill="url(#perete)"/>

  <!-- fereastra mare, lumina naturala -->
  <rect x="90" y="90" width="380" height="470" rx="8" fill="url(#cer)"/>
  <rect x="90" y="90" width="380" height="470" rx="8" fill="none" stroke="#dcd2c6" stroke-width="10"/>
  <line x1="280" y1="90" x2="280" y2="560" stroke="#dcd2c6" stroke-width="7"/>
  <line x1="90" y1="325" x2="470" y2="325" stroke="#dcd2c6" stroke-width="7"/>

  <!-- copaci difuzi dincolo de fereastra -->
  <circle cx="170" cy="270" r="72" fill="#93b3a1" opacity="0.5"/>
  <circle cx="230" cy="310" r="52" fill="#6b8f7a" opacity="0.35"/>
  <circle cx="380" cy="250" r="60" fill="#93b3a1" opacity="0.4"/>
  <circle cx="420" cy="320" r="45" fill="#6b8f7a" opacity="0.3"/>

  <!-- raza de lumina pe podea -->
  <path d="M90 560 L470 560 L620 900 L200 900 Z" fill="url(#lumina)"/>

  <!-- birou -->
  <rect x="140" y="620" width="540" height="26" rx="6" fill="url(#birou)"/>
  <rect x="180" y="646" width="20" height="160" fill="#a8825f" opacity="0.9"/>
  <rect x="620" y="646" width="20" height="160" fill="#a8825f" opacity="0.9"/>

  <!-- documente pe birou -->
  <rect x="230" y="586" width="120" height="34" rx="3" fill="#ffffff" opacity="0.95"/>
  <rect x="244" y="576" width="120" height="34" rx="3" fill="#fdfbf8" opacity="0.9"/>
  <line x1="258" y1="590" x2="340" y2="590" stroke="#dceaef" stroke-width="4"/>
  <line x1="258" y1="600" x2="320" y2="600" stroke="#dceaef" stroke-width="4"/>

  <!-- cana -->
  <rect x="430" y="580" width="46" height="40" rx="5" fill="#ffffff"/>
  <path d="M476 592 q18 8 0 20" stroke="#ffffff" stroke-width="7" fill="none"/>
  <ellipse cx="453" cy="580" rx="23" ry="6" fill="#dceaef"/>

  <!-- planta pe birou -->
  <path d="M560 620 l0 -34" stroke="#6b8f7a" stroke-width="5"/>
  <ellipse cx="548" cy="572" rx="20" ry="11" fill="#6b8f7a" transform="rotate(-28 548 572)"/>
  <ellipse cx="574" cy="568" rx="20" ry="11" fill="#93b3a1" transform="rotate(24 574 568)"/>
  <ellipse cx="560" cy="552" rx="14" ry="20" fill="#6b8f7a"/>
  <path d="M544 620 h34 l-5 24 h-24 z" fill="#c1705c"/>

  <!-- scaun sugerat -->
  <rect x="330" y="700" width="170" height="18" rx="9" fill="#4a8ba3" opacity="0.30"/>
  <rect x="352" y="718" width="12" height="120" fill="#4a8ba3" opacity="0.22"/>
  <rect x="466" y="718" width="12" height="120" fill="#4a8ba3" opacity="0.22"/>
  <rect x="336" y="600" width="158" height="105" rx="14" fill="#4a8ba3" opacity="0.18"/>

  <!-- podea -->
  <rect y="900" width="800" height="100" fill="#ebe2d8"/>
  <rect y="900" width="800" height="6" fill="#dcd2c6"/>
</svg>
