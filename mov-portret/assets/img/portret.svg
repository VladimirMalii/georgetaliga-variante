<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Marcaj pentru fotografia profesională a medicului">
  <defs>
    <linearGradient id="fund" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#e4ede7"/>
      <stop offset="55%" stop-color="#dceaef"/>
      <stop offset="100%" stop-color="#ebe2d8"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.42" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#fund)"/>
  <ellipse cx="380" cy="360" rx="420" ry="400" fill="url(#spot)"/>

  <!-- silueta neutra, clar stilizata: nu sugereaza o persoana reala -->
  <circle cx="450" cy="440" r="132" fill="#4a8ba3" opacity="0.22"/>
  <path d="M450 600 q-190 0 -230 210 q-14 74 -6 190 h472 q8 -116 -6 -190 q-40 -210 -230 -210 z"
        fill="#4a8ba3" opacity="0.18"/>

  <!-- halat sugerat prin doua linii -->
  <path d="M450 600 l-46 190 l46 46 l46 -46 z" fill="#ffffff" opacity="0.55"/>

  <!-- stetoscop stilizat -->
  <path d="M392 640 q-30 96 22 150" stroke="#6b8f7a" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="418" cy="800" r="18" fill="#6b8f7a" opacity="0.55"/>

  <!-- text indicativ -->
  <text x="450" y="1060" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2c5f75" opacity="0.8">Fotografie profesională</text>
  <text x="450" y="1104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#5c686c" opacity="0.75">Portret real al doamnei doctor</text>
  <text x="450" y="1140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#8a9599" opacity="0.75">900 × 1200 px</text>
</svg>
